<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bem-vindo | FLIC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #fff;
      background: #1455ad;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(ellipse at 50% 30%, #357bd3 0%, #1455ad 55%, #0b3474 100%);
      text-align: center;
    }
    .entrada {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: min(100%, 720px);
      padding: 36px 16px;
      border-radius: 24px;
      color: inherit;
      text-decoration: none;
    }
    .entrada:focus-visible { outline: 3px solid white; outline-offset: 8px; }
    .boas-vindas { margin: 0; font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; }
    h1 {
      margin: 0;
      font-size: clamp(88px, 22vw, 200px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.065em;
      padding-right: .065em;
    }
    .subtitulo { margin: 0; font-size: 16px; color: #e0edff; }
    .acessar {
      display: inline-flex;
      align-items: center;
      gap: 24px;
      margin-top: 20px;
      padding: 16px 28px;
      border-radius: 999px;
      background: #fff;
      color: #124991;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 8px 28px #07295833;
      transition: transform .2s ease, background .2s ease;
    }
    .entrada:hover .acessar { background: #eaf3ff; transform: translateY(-3px); }
    @media (prefers-reduced-motion: reduce) {
      .acessar { transition: none; }
      .entrada:hover .acessar { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <a class="entrada" href="/painel" aria-label="Acessar o sistema FLIC">
      <p class="boas-vindas">Bem-vindo, {{ usuario.nome }}.</p>
      <h1>FLIC</h1>
      <p class="subtitulo">Sua gestão financeira começa aqui.</p>
      <span class="acessar">Acessar o sistema <span aria-hidden="true">&#8594;</span></span>
    </a>
  </main>
</body>
</html>
