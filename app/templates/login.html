<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FLIC</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center px-4" style="background-color:#222049;">

  <div class="w-full max-w-sm">

    <!-- Marca FLIC -->
    <div class="flex justify-center mb-8">
      <div class="bg-white rounded-2xl px-8 py-5 shadow-xl">
        <img src="/static/1782164034225.png" alt="FLIC" class="h-20 w-auto">
      </div>
    </div>

    <!-- Card de login -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">

      {% if erro %}
      <div class="mb-5 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">
        {{ erro }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">E-mail</label>
          <input
            id="email" name="email" type="email" required autofocus
            placeholder="seu@email.com"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none transition
                   focus:border-[#5e93cc] focus:ring-2 focus:ring-[#5e93cc]/20"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="senha">Senha</label>
          <input
            id="senha" name="senha" type="password" required
            placeholder="••••••••"
            class="w-full rounded-lg border border-gray-300 px-4 py-2.5 text-sm outline-none transition
                   focus:border-[#5e93cc] focus:ring-2 focus:ring-[#5e93cc]/20"
          />
        </div>

        <button
          type="submit"
          class="w-full text-white font-semibold rounded-lg py-2.5 text-sm transition-colors
                 bg-[#222049] hover:bg-[#1a1836]"
        >
          Entrar
        </button>

      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color:rgba(255,255,255,0.4);">
      Acesso restrito — use suas credenciais corporativas
    </p>
  </div>

</body>
</html>
