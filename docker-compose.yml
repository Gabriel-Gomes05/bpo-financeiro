services:
  web:
    build: .
    ports:
      - "127.0.0.1:8888:8000"
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=http://localhost:8888,http://127.0.0.1:8888
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./app:/app/app
      - ./static:/app/static
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - database
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=bpo
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      - POSTGRES_DB=bpo_financeiro
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
      - -c
      - log_min_error_statement=error
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bpo -d bpo_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  frontend:
  database:
    internal: true
